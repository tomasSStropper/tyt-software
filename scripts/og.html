<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Doto;src:url(../public/fonts/doto.woff2) format("woff2");font-weight:100 900}
@font-face{font-family:Archivo;src:url(../public/fonts/archivo.woff2) format("woff2");font-weight:100 900}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 720px 560px at 900px 315px,#0e0e10 0%,#0a0a0b 55%,#050505 100%) #050505;color:#ecebe7;font-family:Archivo,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(125,146,255,.08) 1px,transparent 1px),linear-gradient(to bottom,rgba(125,146,255,.08) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:linear-gradient(to right,transparent 42%,#000 70%);mask-image:linear-gradient(to right,transparent 42%,#000 70%)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.012) 0 1px,transparent 1px 3px)}
.k{position:absolute;left:72px;top:68px;display:flex;align-items:center;gap:16px;font:900 25px/1 Doto,ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:#d8d6d2}
.k i{width:12px;height:12px;border-radius:50%;background:#3b5bff;box-shadow:0 0 8px rgba(59,91,255,.7)}
h1{position:absolute;left:72px;top:170px;width:640px;font:700 66px/69px Archivo,system-ui,sans-serif;letter-spacing:0;color:#ecebe7}
h1 span{color:#7d92ff}
.bar{position:absolute;left:72px;top:480px;width:84px;height:6px;background:#3b5bff}
.f{position:absolute;left:72px;top:542px;font:900 25px/1 Doto,ui-monospace,monospace;letter-spacing:.07em;text-transform:uppercase;color:#d8d6d2}
.logo{position:absolute;left:644px;top:59px;width:512px;height:512px;mix-blend-mode:lighten}
</style></head><body>
<div class="grid"></div>
<div class="scan"></div>
<div class="k">TyT Software &amp; Solutions<i></i></div>
<h1>Construimos sitios, sistemas y <span>automatización</span> a la medida.</h1>
<div class="bar"></div>
<div class="f">San Vito, Costa Rica · tytsoftware.com</div>
<img class="logo" src="../public/icon-512.png" alt="">
</body></html>
